name: CodSpeed Benchmarks

on:
  # Both triggers are required: pushes to main establish the baseline
  # and pull requests are compared against it.
  push:
    branches:
      - main
  pull_request:
  # Lets CodSpeed trigger backtests on older commits to seed baseline data.
  workflow_dispatch: {}

# This is a public repository, so the action uses tokenless uploads.
# No CODSPEED_TOKEN secret or id-token permission is needed, and that is
# also the only mode that works on pull requests from forks.
permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: uv run poe bench
